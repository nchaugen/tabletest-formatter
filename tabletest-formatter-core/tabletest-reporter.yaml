title: "TableTest Formatter — Specification"
intro: >
  How the formatter lays out a TableTest table: which cell widths it computes, how it pads and
  aligns each cell, and what it leaves untouched. Every rule below is executable — it is a test
  that runs in CI, and each scenario is one row of that test's table.
