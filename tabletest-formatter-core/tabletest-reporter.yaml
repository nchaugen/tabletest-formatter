# Report-time curation for the formatter's living spec.
#
# Spec metadata is applied when the report is generated, not when the tests run. Nothing here
# is a test-code concern, and nothing here is JVM-specific — the second (non-JVM)
# implementation ships the same file. See the reporter decision spec-metadata-sidecar-file.
#
# No publish selection: every @TableTest in this module publishes, which is the default and
# has been the formatter's model since before report-time selection existed.

# --- Spec metadata --------------------------------------------------------------------
# Without a title the root index is named by the deepest common package segment ("core").
#
# The features list is the reading order, and it follows the formatter's own pipeline rather
# than the alphabetical default: find the tables, measure what the cells need, format each
# cell, size each column, lay out the row, then indent the result — with the lines that take
# no part in alignment, and the inputs that defeat formatting altogether, at the end. Names
# match a page by its slug; these pages are one test class each, so the slug is the class's.
title: "TableTest Formatter"
intro: >
  How the formatter lays out a TableTest table: where it finds the tables in a source file,
  what it computes for each cell and column, and what it leaves untouched. The features below
  are ordered as the formatter itself works, so reading top to bottom follows one table through
  the pipeline. Every rule is executable — it is a test that runs in CI, and each scenario is
  one row of that test's table.
features:
  - name: table-extraction            # finding the tables in a source file
  - name: display-width-rules         # how wide a value renders
  - name: cell-value-formatting-rules # normalising the value inside a cell
  - name: column-width-rules          # sizing a column to its widest cell
  - name: cell-padding-and-alignment  # laying the padded cells out as a row
  - name: string-array-layout        # writing a laid-out table back as an array of literals
  - name: comment-and-blank-line-rules # the lines that take no part in alignment
  - name: indent-configuration       # where the indent setting comes from
  - name: indentation-rules           # placing the finished table back in its source
  - name: graceful-degradation        # input the formatter cannot lay out
